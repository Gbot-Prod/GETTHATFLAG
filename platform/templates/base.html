{% load static %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GETTHATFLAG{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body class="h-full bg-slate-50 text-slate-900 antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <a href="{% url 'home' %}" class="flex items-center gap-2 text-lg font-bold tracking-tight">
        <span class="rounded-md bg-emerald-500 px-2 py-0.5 text-sm text-white">GTF</span>
        GETTHATFLAG
      </a>
      <div class="flex items-center gap-6 text-sm font-medium text-slate-600">
        <a href="{% url 'home' %}" class="hover:text-slate-900">Dashboard</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
