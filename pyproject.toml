[project]
name = "getthatflag"
version = "0.1.0"
description = "Private, single-user CTF training site"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "django-axes>=8.3.1",
    "django-environ>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["platform"]
testpaths = ["platform"]
